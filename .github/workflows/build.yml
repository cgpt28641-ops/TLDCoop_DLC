# Builds winhttp.dll on Windows with MSVC (as build.cmd does), runs the offline tests, and packs the zip players
# install: winhttp.dll, the TLDCoop folder (the characters and animations, taken from the original v0.13.1 release,
# unchanged) and INSTALL.txt. The zip is this run's artifact ("TLDCoop_DLC").
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and build
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build build > build.log 2>&1
          set rc=%ERRORLEVEL%
          type build.log
          exit /b %rc%

      - name: Report compiler warnings in the fork's files
        if: always()
        shell: pwsh
        run: |
          $w = Select-String -Path build.log -Pattern 'warning C\d+' | Where-Object { $_.Line -match 'content|optional_content|session\.cpp|coop_menu|core\.cpp|config\.cpp|net_runtime|bot\\main' }
          if ($w) { foreach ($x in $w) { Write-Host "::warning title=compiler::$($x.Line.Trim())" } }
          else { Write-Host "::notice title=compiler::no warnings in the fork's files" }
          $e = Select-String -Path build.log -Pattern 'error C\d+|fatal error|error LNK|: error' | Select-Object -First 9
          foreach ($x in $e) { Write-Host "::error title=compiler::$($x.Line.Trim())" }

      - name: Offline tests
        shell: pwsh
        run: |
          $failed = @()
          foreach ($t in Get-ChildItem build\*_test.exe) {
            Write-Host "=== $($t.Name)"
            $out = & $t.FullName 2>&1 | Out-String
            Write-Host $out
            $last = ($out.Trim() -split "`n")[-1].Trim()
            if ($LASTEXITCODE -ne 0) {
              $failed += $t.Name
              $bad = ($out -split "`n" | Where-Object { $_ -match 'FAIL' }) -join ' | '
              Write-Host "::error title=$($t.BaseName)::$bad"
            } else {
              Write-Host "::notice title=$($t.BaseName)::passed: $last"
            }
          }
          if ($failed.Count) { Write-Error "failed: $($failed -join ', ')"; exit 1 }

      - name: Pack the zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force pack, upstream | Out-Null
          gh release download v0.13.1 -R ScarredVeins/TLDCo-Op -p "TLDCoop-v0.13.1.zip" -D upstream
          Expand-Archive upstream\TLDCoop-v0.13.1.zip upstream\zip
          Copy-Item -Recurse upstream\zip\TLDCoop pack\TLDCoop
          Copy-Item build\winhttp.dll pack\
          Copy-Item INSTALL_DLC.txt pack\INSTALL.txt
          foreach ($f in Get-ChildItem -Recurse -File pack) {
            $h = (Get-FileHash $f.FullName).Hash
            Write-Host "::notice title=sha256::$($f.Name) $h ($($f.Length) bytes)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: TLDCoop_DLC
          path: pack/
          if-no-files-found: error
