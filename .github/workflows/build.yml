# Builds winhttp.dll on Windows with MSVC (as build.cmd does), runs the offline tests, and packs the zip players
# install: winhttp.dll, the TLDCoop folder (the characters and animations, taken from the original v0.13.1 release,
# unchanged) and INSTALL.txt. The zip is this run's artifact ("TLDCoop_DLC").
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # the dll-only release below, when the artifact can't be stored

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # TLDCoop_DLC: the self-update's token (repository secret UPDATE_TOKEN: a fine-grained, read-only token for this
      # repository) and our build's id, written into a header that isn't in the repo.
      - name: Update token and build id
        shell: pwsh
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          $t = [System.Text.Encoding]::ASCII.GetBytes("$env:UPDATE_TOKEN")
          $k = Get-Random -Minimum 1 -Maximum 255
          $b = for ($i = 0; $i -lt $t.Length; $i++) { '0x{0:x2}' -f ($t[$i] -bxor (($k + $i * 7) -band 0xff)) }
          $arr = if ($t.Length) { ($b -join ',') } else { '0' }
          $sha = "$env:GITHUB_SHA".Substring(0, 7)
          $h = "namespace {`nconstexpr unsigned char kSecret[] = {$arr};`nconstexpr size_t kSecretLen = $($t.Length);`nconstexpr unsigned char kSecretKey = $k;`nconstexpr const char* kBuild = `"$sha`";`n}`n"
          Set-Content -Path src/update_secret.inc -Value $h -Encoding ascii
          Write-Host "::notice title=update::build id $sha, update token: $(if ($t.Length) { 'yes' } else { 'none (secret UPDATE_TOKEN not set)' })"

      - name: Configure and build
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release || exit /b 1
          cmake --build build > build.log 2>&1
          set rc=%ERRORLEVEL%
          type build.log
          exit /b %rc%

      - name: Report compiler warnings in the fork's files
        if: always()
        shell: pwsh
        run: |
          $w = Select-String -Path build.log -Pattern 'warning C\d+' | Where-Object { $_.Line -match 'content|optional_content|session\.cpp|coop_menu|core\.cpp|config\.cpp|net_runtime|bot\\main' }
          if ($w) { foreach ($x in $w) { Write-Host "::warning title=compiler::$($x.Line.Trim())" } }
          else { Write-Host "::notice title=compiler::no warnings in the fork's files" }
          $e = Select-String -Path build.log -Pattern 'error C\d+|fatal error|error LNK|: error' | Select-Object -First 9
          foreach ($x in $e) { Write-Host "::error title=compiler::$($x.Line.Trim())" }

      - name: Offline tests
        shell: pwsh
        run: |
          $failed = @()
          foreach ($t in Get-ChildItem build\*_test.exe) {
            Write-Host "=== $($t.Name)"
            $out = & $t.FullName 2>&1 | Out-String
            Write-Host $out
            $last = ($out.Trim() -split "`n")[-1].Trim()
            if ($LASTEXITCODE -ne 0) {
              $failed += $t.Name
              $bad = ($out -split "`n" | Where-Object { $_ -match 'FAIL' }) -join ' | '
              Write-Host "::error title=$($t.BaseName)::$bad"
            } else {
              Write-Host "::notice title=$($t.BaseName)::passed: $last"
            }
          }
          if ($failed.Count) { Write-Error "failed: $($failed -join ', ')"; exit 1 }

      - name: Pack the zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force pack, upstream | Out-Null
          gh release download v0.13.1 -R ScarredVeins/TLDCo-Op -p "TLDCoop-v0.13.1.zip" -D upstream
          Expand-Archive upstream\TLDCoop-v0.13.1.zip upstream\zip
          Copy-Item -Recurse upstream\zip\TLDCoop pack\TLDCoop
          Copy-Item build\winhttp.dll pack\
          Copy-Item third_party\dynamictrees\tldcoop_trees.bundle pack\TLDCoop\
          Copy-Item INSTALL_DLC.txt pack\INSTALL.txt
          foreach ($f in Get-ChildItem -Recurse -File pack) {
            $h = (Get-FileHash $f.FullName).Hash
            Write-Host "::notice title=sha256::$($f.Name) $h ($($f.Length) bytes)"
          }

      # The whole zip (~220 MB, mostly the characters) only when asked for (Actions -> build -> Run workflow): the
      # free plan stores 0.5 GB of artifacts, two zips. Every push puts winhttp.dll in the dll-latest release instead.
      - uses: actions/upload-artifact@v4
        id: upload
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          name: TLDCoop_DLC
          path: pack/
          if-no-files-found: error
          retention-days: 2

      # Every push: winhttp.dll alone (our code only, no game assets) to the private repo's "dll-latest" release
      # (release files don't count against the Actions storage).
      - name: winhttp.dll to the dll-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dll-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create dll-latest -R "$GITHUB_REPOSITORY" --prerelease --title "winhttp.dll (latest)" --notes "Only winhttp.dll"
          gh release upload dll-latest pack/winhttp.dll -R "$GITHUB_REPOSITORY" --clobber
          gh release edit dll-latest -R "$GITHUB_REPOSITORY" --notes "Only winhttp.dll, build ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          echo "::notice::winhttp.dll is in the dll-latest release"
