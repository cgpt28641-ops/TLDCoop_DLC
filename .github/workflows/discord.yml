# The Discord bridge (tools/discord/bridge.py): every 30 minutes (and by hand: Actions -> discord -> Run workflow) the
# bot reads the server's new messages and logs into the "discord" branch (inbox/) and posts what's waiting in its
# outbox/. Claude reads and writes that branch; nothing here touches main or the builds. Needs the repository secret
# DISCORD_BOT_TOKEN (Settings -> Secrets and variables -> Actions); optional variable DISCORD_DEFAULT_CHANNEL.
name: discord

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:  # (Claude runs it right after putting a message in the outbox)

permissions:
  contents: write

concurrency:
  group: discord
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: The discord branch
        run: |
          set -e
          if git ls-remote --exit-code --heads "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" discord >/dev/null; then
            git clone --depth 1 --branch discord "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" box
          else
            mkdir box && cd box && git init -q -b discord && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
            echo "Discord inbox/outbox (tools/discord/bridge.py on main). Not code." > README.md
            mkdir -p outbox && touch outbox/.keep
          fi
      - name: Read and post
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_DEFAULT_CHANNEL: ${{ vars.DISCORD_DEFAULT_CHANNEL }}
        run: python3 main/tools/discord/bridge.py box
      - name: Save
        run: |
          cd box
          git config user.name "TLDCoop bridge"
          git config user.email "bridge@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "discord: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin discord 2>/dev/null || true
            if git push -q origin HEAD:discord; then exit 0; fi
            sleep 5
          done
          exit 1
