# TLDCoop_DLC: the Discord bridge's runner. The bridge (bridge.py) and the server's messages live in the repo
# cgpt28641-ops/tldcoop-discord (public since 11.11: the messages are kept there only ENCRYPTED, crypt.py seals them
# with its vault.pub after each run; no key on GitHub); it runs here because this repo is public (Actions minutes; 07.11 the private pool ran
# out). It checks that repo out with the secret DISCORD_REPO_TOKEN (a fine-grained token: Contents read/write on
# tldcoop-discord only), runs the bridge with DISCORD_BOT_TOKEN, and pushes inbox/outbox back there. Nothing of the
# messages is printed in this public log (the bridge prints counts only).
name: discord

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cgpt28641-ops/tldcoop-discord
          token: ${{ secrets.DISCORD_REPO_TOKEN }}
          path: bridge
      # Karol 14.11: the bridge moves to the server PC (tldcoop-discord/local/run_bridge.py, every 60 s). It renews
      # local/alive.txt every 10 min; while that is under 15 min old this workflow does nothing (two bridges would post
      # the same outbox file twice). With the PC off it runs as before.
      - name: Server PC running the bridge?
        id: pc
        working-directory: bridge
        run: |
          t=$(cat local/alive.txt 2>/dev/null | tr -dc 0-9); now=$(date +%s)
          if [ -n "$t" ] && [ $((now - t)) -lt 900 ]; then echo "the server PC runs the bridge ($((now - t)) s ago): nothing to do"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      # Without write access to the private repo the bridge's posts would be sent again on every run (the outbox
      # couldn't be emptied): it doesn't run then.
      - name: Can save
        if: steps.pc.outputs.skip != '1'
        working-directory: bridge
        run: |
          if ! git push --dry-run -q origin HEAD:main 2>/dev/null; then
            echo "DISCORD_REPO_TOKEN can't write to tldcoop-discord (Contents: Read and write needed)"; exit 1
          fi
      - name: Read and post
        if: steps.pc.outputs.skip != '1'
        working-directory: bridge
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_DEFAULT_CHANNEL: ${{ vars.DISCORD_DEFAULT_CHANNEL }}
        run: |
          if python3 bridge.py . > /dev/null 2>&1; then echo "bridge ok"; else echo "bridge FAILED"; exit 1; fi
      # Karol 11.11: the messages go into git only sealed (encrypted). If sealing fails nothing is saved.
      - name: Seal
        if: steps.pc.outputs.skip != '1'
        working-directory: bridge
        run: |
          python3 -c "import cryptography" 2>/dev/null || pip install -q --break-system-packages cryptography || pip install -q cryptography
          python3 crypt.py seal . > /dev/null
      - name: Save
        if: steps.pc.outputs.skip != '1'
        working-directory: bridge
        run: |
          git config user.name "TLDCoop bridge"
          git config user.email "bridge@users.noreply.github.com"
          mkdir -p inbox outbox
          git add -A inbox outbox vault
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "discord: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin main || true
            if git push -q origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
